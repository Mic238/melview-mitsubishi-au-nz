name: Build and Lint

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.12.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked development dependencies
        run: npm ci
      - name: Lint all plugin source files
        run: npm run lint
      - name: Test Homebridge 1 and 2 packages and source types
        run: npm run test:compat
